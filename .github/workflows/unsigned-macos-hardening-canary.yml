name: Fork-only unsigned macOS hardening canary

# Builds an isolated unsigned Buzz.app from one exact hardening-branch commit.
# This workflow never signs, notarizes, publishes a release, or replaces an
# installed application.
on:
  push:
    branches:
      - agent/buzz-fleet-hardening-current-main-20260802
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build isolated unsigned macOS app
    if: github.repository == 'kensicklink/buzz'
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Require approved fork branch and exact commit
        env:
          EXPECTED_REF: refs/heads/agent/buzz-fleet-hardening-current-main-20260802
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" != "$EXPECTED_REF" ]]; then
            echo "::error::Unsigned hardening canary requires $EXPECTED_REF; got $SOURCE_REF"
            exit 1
          fi
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase 40-character SHA"
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Dispatch SHA $SOURCE_SHA does not match expected SHA $EXPECTED_SHA"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out SHA $ACTUAL_SHA does not match expected SHA $EXPECTED_SHA"
            exit 1
          fi

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: fork-unsigned-hardening-canary

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Derive isolated canary version
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-hardening.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building unsigned canary version $VERSION from $GITHUB_SHA"

      - name: Patch isolated canary version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri
          cargo update --workspace

      - name: Generate non-updating bundle config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = {
              "productName": "Buzz Hardening Canary",
              "identifier": "xyz.block.buzz.app.dev.hardeningcanary",
              "bundle": {
                  "macOS": {"minimumSystemVersion": "10.15"},
                  "createUpdaterArtifacts": False,
              }
          }
          Path("desktop/src-tauri/tauri.canary.conf.json").write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$MESH_REV_SHORT" -type d -name "$MESH_REV_SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $MESH_REV_SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      - name: Build unsigned Tauri app
        run: cd desktop && pnpm tauri build --verbose --no-sign --features mesh-llm --bundles app --config src-tauri/tauri.canary.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"

      - name: Package isolated unsigned app
        id: artifact
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP=$(find desktop/src-tauri/target/release/bundle/macos -name 'Buzz Hardening Canary.app' -type d | head -1)
          if [[ -z "$APP" ]]; then
            echo "::error::No isolated Buzz Hardening Canary.app bundle found"
            exit 1
          fi
          if codesign -dv --verbose=4 "$APP" 2>&1 | grep -q 'Authority=Developer ID'; then
            echo "::error::Fork-only canary unexpectedly carries a Developer ID signature"
            exit 1
          fi
          STAGE="$RUNNER_TEMP/buzz-unsigned-hardening-canary"
          mkdir -p "$STAGE"
          ARCHIVE="$STAGE/Buzz_${VERSION}_${EXPECTED_SHA}_unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          (
            cd "$STAGE"
            shasum -a 256 "$(basename "$ARCHIVE")" > SHA256SUMS.txt
          )
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "expected_sha=$EXPECTED_SHA"
            echo "version=$VERSION"
            echo "product_name=Buzz Hardening Canary"
            echo "bundle_identifier=xyz.block.buzz.app.dev.hardeningcanary"
            echo "signed=false"
            echo "notarized=false"
            echo "installed_app_replaced=false"
          } > "$STAGE/canary-manifest.txt"
          echo "path=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Upload isolated unsigned canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-unsigned-hardening-canary-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 3

      - name: Save pnpm store cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
